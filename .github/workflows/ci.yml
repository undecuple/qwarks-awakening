# CI without the game: the game cannot be built here (the lifted code comes from the player's own EBOOT and is never
# committed), so this checks what can be checked without game data: that every patch applies to the pinned ps3recomp,
# that the release tools pass their host tests and every toolchain download is pinned, and that no secret is in the
# history, that the native Windows setup can prepare the patched toolkit, and that the launcher still cross-compiles
# for Windows with the pinned toolchain (the release itself is built in release.yml, on tags and manual dry runs only).
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9  # v32.0.0
      - name: Patches apply to the pinned ps3recomp
        run: nix develop .#ci --command python3 tools/ps3recomp_patched.py
      - name: Host tests (no game data, no GPU; a SKIP counts as a failure)
        # tools/run-host-tests.sh runs the tests in tools/host-tests.txt against the patched tree built above and prints one
        # ok/FAIL/SKIP line per test; it fails at the end when any test failed. RC_TEST_CC=gcc: the shell's own compiler
        # only; nix develop keeps the runner's PATH, so the runner's system clang would be found by the logger test and
        # link against the shell's glibc, and its program does not start (exit 127)
        run: RC_HOST_TESTS_STRICT=1 RC_TEST_CC=gcc nix develop .#ci --command bash tools/run-host-tests.sh -v

  release-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Dear ImGui submodule (test_pack_appimage.py builds the AppDir from this checkout)
        run: git submodule update --init --depth 1 third_party/imgui
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9  # v32.0.0
      - name: Host tests of the release tools (a SKIP counts as a failure)
        # Every tools/release/test_*.py through tools/run-host-tests.sh in strict mode: a test that prints a SKIP line or
        # exits 0 without a pass line fails the step (a plain loop took "SKIP" + exit 0 as a pass). The .#ci shell has
        # cmake, git and Pillow, so no test lacks a tool. test_launcher_navigation.py needs the built native launcher
        # and runs with --launcher in launcher-linux. test_pe_imports.py runs its self-test here; its real-file half
        # SKIPs (no exe is built in this job: launcher-build checks the real launcher.exe with pe_imports.py), so it is
        # allow-listed with that reason. Every test runs; the step fails at the end and names the failed ones.
        run: |
          list="$RUNNER_TEMP/release-tests.txt"
          { echo "#:allow-skip tools/release/test_pe_imports.py no exe is built in this job; launcher-build checks launcher.exe"
            ls tools/release/test_*.py | grep -vxF tools/release/test_launcher_navigation.py; } > "$list"
          RC_HOST_TESTS_STRICT=1 nix develop .#ci --command bash tools/run-host-tests.sh -v "$list"
      - name: Toolchain manifest (every download pinned)
        run: python3 tools/release/fetch_toolchain.py --check --strict

  # The launcher's keyboard paths, screens and fixtures (tools/release/test_launcher_navigation.py) on the native Linux
  # program, built as release.yml's linux job builds it: ubuntu-22.04, the apt list from the repository, SDL3 from its
  # pinned source (SHA-256 checked) linked in. The test drives the program with SDL's dummy video driver and software
  # renderer on synthetic libraries; no game file, game process or network is involved. Without --launcher the test
  # only prints SKIP, so it runs here and not in the release-tools loop.
  launcher-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Dear ImGui submodule (not ps3recomp)
        run: git submodule update --init --depth 1 third_party/imgui
      - name: Build packages (Ubuntu archive)
        run: |
          sudo apt-get update -q
          # shellcheck disable=SC2046  # one package name per line
          sudo apt-get install -y -q --no-install-recommends $(grep -v '^#' tools/release/linux-build-packages.txt)
      - name: SDL3 source, CMake and Ninja for Linux (SHA-256 checked)
        run: python3 tools/release/fetch_toolchain.py --only sdl3-source,cmake-linux,ninja-linux
      - name: Launcher (native; SDL3, libstdc++ and libgcc linked in)
        run: tools/release/build_launcher_linux.sh build/launcher-linux
      - name: Launcher navigation (synthetic libraries, dummy video driver)
        run: python3 tools/release/test_launcher_navigation.py --launcher build/launcher-linux/qwarks-awakening

  windows-native-setup:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      # Exercise the common Git for Windows setting explicitly. The patcher exports the pinned submodule commit and runs
      # git with line-ending conversion off, and .gitattributes keeps the patches' bytes, so the generated toolkit is
      # independent of checkout line endings.
      - name: CRLF checkout
        run: git config --global core.autocrlf true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Pinned ps3recomp submodule
        run: git submodule update --init --depth 1 third_party/ps3recomp
      - name: Patched toolkit with native Python and Git
        run: python tools/ps3recomp_patched.py
      - name: Native patcher host tests
        run: python tools/release/test_ps3recomp_patched.py
      - name: PowerShell entry point parses
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path tools/build-windows.ps1), [ref]$tokens, [ref]$errors)
          if ($errors.Count) { $errors | Format-List; exit 1 }

  # The launcher, cross-compiled for Windows on every push with the pinned toolchain (the release builds it on a
  # Windows runner only at a tag): llvm-mingw's Linux build and SDL3's MinGW devel package from
  # tools/release/toolchain.json (SHA-256 checked), CMake and Ninja from the flake's .#ci shell (flake.lock).
  # Ubuntu's own packages have no SDL3 on ubuntu-latest (24.04), so there is no native build here.
  launcher-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Dear ImGui submodule (not ps3recomp)
        run: git submodule update --init --depth 1 third_party/imgui
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9  # v32.0.0
      - name: Toolchain (llvm-mingw for Linux, SDL3 MinGW devel; SHA-256 checked)
        run: python3 tools/release/fetch_toolchain.py --only llvm-mingw-linux,sdl3
      - name: Launcher (cross-compiled for Windows x64)
        run: |
          nix develop .#ci --command env LLVM_MINGW="$PWD/work/release/toolchain-cache/trees/llvm-mingw-linux" \
            tools/release/build_launcher.sh build/launcher-release
      - name: Launcher imports (system DLLs and SDL3.dll only)
        run: python3 tools/release/pe_imports.py --allow SDL3.dll build/launcher-release/launcher.exe

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks (full history)
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz
          echo "cb49b7de5ee986510fe8666ca0273a6cc15eb82571f2f14832c9e8920751f3a4  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .
