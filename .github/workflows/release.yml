# Release build: the launcher for Windows x64 (a bare zip and a full build zip), on a GitHub Windows runner, and the
# notes-only release of each game; adapted from Project Helghast, the Killzone 3 PC port's release workflow (same
# author, MIT).
#
# Tags: `launcher-vMAJOR.MINOR.PATCH` is the launcher release: it builds, then creates a DRAFT release titled
# "Launcher vX.Y.Z" with the assets and the [All games] and [Launcher] notes. `<id>-vMAJOR.MINOR.PATCH`, for each game
# id of data/titles/catalog.json, is a game release: a DRAFT pre-release titled "<badge name> vX.Y.Z" with that game's
# notes and its playability state, no assets (a game is built on the player's PC from their own copy) and never marked
# latest. workflow_dispatch is a dry run of the launcher: it builds and uploads the workflow artifact, never publishes.
# Nothing runs on a push to a branch or on a pull request.
# Release rules: the version comes from the tag and must equal tools/release/names.py VERSION, for a launcher tag (in
# the build and the publish job; bump_version.py keeps the same string in the launcher, the port's CMakeLists.txt and
# CITATION.cff) and for a game tag too: a game's release names the release whose build kit builds it, so a game tag is
# only made together with the launcher tag of the same version, from the same commit. The launcher release is a full
# release marked latest at every version (one clear download); a game release stays a pre-release
# while its game is not playable start to finish. The notes are written from the version's CHANGELOG.md section (tools/release/release_notes.py --tag, which
# refuses a version without a section, an unknown game and a tag with no item) before anything is built; SHA256SUMS
# (the setup exe and the three zips, no per-file .sha256 since 0.3.1) sits beside the launcher's assets; an existing
# release is never touched, no tag is created, moved or deleted, and no asset is overwritten. The maintainer reads each draft and publishes it.
#
# What is built: the launcher (launcher/, SDL3 + Dear ImGui) and two zips from one file list: the bare launcher,
# which asks before it fetches the build kit on a player's first Build, and the full build zip, which holds the same
# files plus the build kit (the release's port/ sources, the patched ps3recomp, llvm-mingw, CMake, Ninja and their
# licences; kit.json lists every kit file with its SHA-256, and the launcher carries that list's hash, compiled in).
# Never a game program: a game is built on the player's own computer from their own copy of it. No game file is read,
# used or produced here. The installer (since 0.3.1): the installer job compiles installer/rc.iss with Inno Setup from the
# full build zip's unpacked folder, taken from the launcher job's artifact (no rebuild: the installed files are the zip's
# bytes); its steps are adapted from the Killzone 3 workflow's.
#
# Third-party pieces: actions/checkout and actions/upload-artifact (GitHub, MIT), the gh CLI (MIT, on the image),
# Dear ImGui (MIT, the third_party/imgui submodule), ps3recomp (MIT, the third_party/ps3recomp submodule, with this
# port's patches applied by tools/ps3recomp-patched.sh; it ships in the full build zip). Downloads at build time, each pinned by SHA-256 in
# tools/release/toolchain.json: llvm-mingw (Apache-2.0 WITH LLVM-exception; MinGW-w64 and winpthreads licences),
# SDL3's MinGW development package (zlib; its SDL3.dll ships in the zip), CMake (BSD-3-Clause), Ninja (Apache-2.0),
# and the Python embeddable package for Windows x64 (Python Software Foundation, PSF-2.0; it ships unmodified in the
# zip's python\ folder and runs the launcher's setup engine, so a player needs no Python of their own). Build tool of
# the installer job: Inno Setup 6.7.3 (Inno Setup License; its setup stub is in the setup exe), the official installer
# pinned by version and SHA-256 in tools/release/toolchain.json build_tools.
#
# Published files (names from tools/release/names.py, checked by tools/release/test_names.py):
#   Qwarks-Awakening-<version>-launcher-windows-x64.zip, Qwarks-Awakening-<version>-build-windows-x64.zip, the
#   Qwarks-Awakening-<version>-launcher-symbols.zip (the launcher's split debug file: the "Get launcher symbols"
#   button fetches it), Qwarks-Awakening-<version>-setup-windows-x64.exe (the installer), and SHA256SUMS (the setup exe
#   and the three zips)
name: release

on:
  push:
    tags:   # the launcher and every game id of data/titles/catalog.json (test_workflows.py checks the list against it)
      - "launcher-v[0-9]+.[0-9]+.[0-9]+"
      - "tods-v[0-9]+.[0-9]+.[0-9]+"
      - "qfb-v[0-9]+.[0-9]+.[0-9]+"
      - "acit-v[0-9]+.[0-9]+.[0-9]+"
      - "a4o-v[0-9]+.[0-9]+.[0-9]+"
      - "ffa-v[0-9]+.[0-9]+.[0-9]+"
      - "nexus-v[0-9]+.[0-9]+.[0-9]+"
      - "rc1-v[0-9]+.[0-9]+.[0-9]+"
      - "rc2-v[0-9]+.[0-9]+.[0-9]+"
      - "rc3-v[0-9]+.[0-9]+.[0-9]+"
      - "dlhd-v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:   # dry run of the launcher only: no inputs, version = names.py VERSION, publishing is skipped

permissions:
  contents: read    # default for every job; only the publish job below gets write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  launcher:
    # launcher tags and the dry run; a game tag skips the build (game-notes below)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref_name, 'launcher-v')
    permissions:
      contents: read    # builds and uploads the artifact only; the publish job below is the one with write
    outputs:
      version: ${{ steps.ver.outputs.version }}
      artifact: ${{ steps.ver.outputs.artifact }}
      zip: ${{ steps.ver.outputs.zip }}
      build_zip: ${{ steps.ver.outputs.build_zip }}
      symbols_zip: ${{ steps.ver.outputs.symbols_zip }}
      setup_exe: ${{ steps.ver.outputs.setup_exe }}
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash          # Git Bash on the image: the same scripts as the Linux build
    steps:
      # Git for Windows checks text files out with CRLF by default: the bash scripts would stop on "\r", and the
      # README, licences and catalogue in the zip would differ from the repository. Keep the repository's bytes.
      - name: Line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Dear ImGui for the launcher, ps3recomp for the build kit in the full zip. Not `submodules: true` on the
      # checkout: that would also fetch any other submodule.
      - name: Dear ImGui and ps3recomp submodules
        run: git submodule update --init --depth 1 third_party/imgui third_party/ps3recomp

      # The scripts call python3; the image has python.exe (a WindowsApps python3 may be the store stub).
      - name: python3 on PATH
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec python "$@"\n' > "$RUNNER_TEMP/bin/python3"
          chmod +x "$RUNNER_TEMP/bin/python3"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Version (from the tag; must equal names.py VERSION)
        id: ver
        run: |
          want=$(python3 -c 'import sys; sys.path.insert(0, "tools/release"); import names; print(names.VERSION)')
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = tag ]; then
            case "$GITHUB_REF_NAME" in
              launcher-v*) ;;
              *) echo "::error::tag $GITHUB_REF_NAME is not launcher-vMAJOR.MINOR.PATCH"; exit 1 ;;
            esac
            v="${GITHUB_REF_NAME#launcher-v}"
            case "$v" in
              *[!0-9.]*|.*|*.|*..*|"") echo "::error::tag $GITHUB_REF_NAME is not launcher-vMAJOR.MINOR.PATCH"; exit 1 ;;
            esac
            if [ "$v" != "$want" ]; then
              echo "::error::tag $GITHUB_REF_NAME says $v but tools/release/names.py VERSION is $want"; exit 1
            fi
          else
            v="$want"
          fi
          python3 tools/release/bump_version.py --agree
          # the version's mirrors (tools/release/bump_version.py writes them together); ve is $v with its dots escaped,
          # so 0.2.0 cannot match 0x2y0 in these regular expressions
          ve=$(printf '%s' "$v" | sed 's/[.]/\\./g')
          grep -qE "^project\(qwark_launcher VERSION $ve " launcher/CMakeLists.txt \
            || { echo "::error::launcher/CMakeLists.txt project VERSION is not $v"; exit 1; }
          grep -qE "^ +VERSION $ve\s*$" port/rc/CMakeLists.txt \
            || { echo "::error::port/rc/CMakeLists.txt project VERSION is not $v"; exit 1; }
          grep -qE "^version: \"?$ve\"?\s*$" CITATION.cff \
            || { echo "::error::CITATION.cff version is not $v"; exit 1; }
          # shellcheck disable=SC2046  # two words: the asset stem and the zip name (no spaces in either)
          set -- $(python3 -c 'import sys; sys.path.insert(0, "tools/release"); import names; print(names.ASSET_STEM, names.launcher_zip_name(sys.argv[1]), names.build_zip_name(sys.argv[1]), names.symbols_zip_name(sys.argv[1]), names.setup_exe_name(sys.argv[1]))' "$v")
          stem="$1"; zip="$2"; bzip="$3"; szip="$4"; setup="$5"
          {
            echo "version=$v"
            echo "artifact=$stem-$v-release"
            echo "zip=$zip"
            echo "build_zip=$bzip"
            echo "symbols_zip=$szip"
            echo "setup_exe=$setup"
          } >> "$GITHUB_OUTPUT"

      # The notes first, so a missing or empty CHANGELOG section fails before the build. A dry run of a version
      # without a section builds anyway (a warning); a tag never does.
      - name: Release notes (from CHANGELOG.md)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p build/release-out
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            python3 tools/release/release_notes.py --tag "launcher-v$VERSION" --out build/release-out/release-body.md
          else
            python3 tools/release/release_notes.py --tag "launcher-v$VERSION" --out build/release-out/release-body.md \
              || echo "::warning::no launcher notes for $VERSION in CHANGELOG.md: a tag for it would fail here"
          fi
          cat build/release-out/release-body.md 2>/dev/null || true

      - name: Host tests of the release tools
        # every test runs; the step fails at the end and names the failed ones. test_catalog.py and the rest run on
        # Linux in ci.yml.
        run: |
          failed=""
          for t in test_names test_release_notes test_fetch_toolchain test_pack_zip test_kit test_stage_sdl3 \
                   test_workflows test_pe_imports test_launcher_src test_rc_iss; do
            python3 "tools/release/$t.py" || failed="$failed $t"
          done
          if [ -n "$failed" ]; then echo "::error::failed host tests:$failed"; exit 1; fi

      - name: Toolchain manifest (every download pinned)
        run: python3 tools/release/fetch_toolchain.py --check --strict

      - name: Toolchain (llvm-mingw, SDL3 devel, CMake, Ninja, Python embeddable, licence texts; SHA-256 checked)
        # the Windows-host entries only (llvm-mingw-linux is ci.yml's Linux cross build); the licence texts go into
        # the full build zip beside the tools they belong to
        run: python3 tools/release/fetch_toolchain.py --only llvm-mingw,sdl3,cmake,ninja,python,llvm-mingw-license,llvm-license,mingw-w64-license,winpthreads-license,lgpl-2.1-text,ninja-license

      # ps3recomp at its pinned commit with every port/patches/*.patch applied: the build kit's recompiler
      - name: Patched ps3recomp (the build kit's toolkit)
        run: bash tools/ps3recomp-patched.sh

      # The kit's file list first: the launcher is built with its SHA-256 (and the full zip's URL and sizes) compiled in,
      # so it accepts exactly this release's kit and nothing else.
      - name: Build kit list (kit.json)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          python3 tools/release/pack_zip.py --make-kit-manifest build/kit/kit.json --toolkit work/ps3recomp-patched \
            --toolchain work/release/toolchain-cache/trees --version "$VERSION"

      - name: Launcher (built with the pinned llvm-mingw and the kit list)
        # build_launcher.sh puts llvm-mingw's bin first on PATH (windres and clang run their helpers from there).
        # LAUNCHER_SYMBOLS=1: it builds with -g, moves the debug information to launcher.exe.debug (objcopy
        # --only-keep-debug), strips the exe and adds the .gnu_debuglink naming that file and its CRC-32, so the launcher
        # in both zips carries the debuglink of exactly the file that goes into the symbols zip
        env:
          LAUNCHER_KIT_MANIFEST: build/kit/kit.json
          LAUNCHER_SYMBOLS: "1"
        run: tools/release/build_launcher.sh build/launcher-release

      # The zip carries SDL3.dll and nothing else of the toolchain: a libc++.dll, libunwind.dll or libwinpthread-1.dll
      # import (a lost -static-libstdc++ / -static-libgcc) would stop the exe on a player's PC. System DLLs and SDL3.dll only.
      - name: Launcher imports (system DLLs and SDL3.dll only)
        run: python3 tools/release/pe_imports.py --allow SDL3.dll build/launcher-release/launcher.exe

      - name: SDL3.dll and its licence (from the pinned devel package)
        run: |
          T=work/release/toolchain-cache/trees/sdl3
          python3 tools/release/stage_sdl3.py --dll "$T/x86_64-w64-mingw32/bin/SDL3.dll" --license "$T/LICENSE.txt" \
            --out work/release/sdl3

      - name: Bare launcher zip, full build zip and launcher symbols zip
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          python3 tools/release/pack_zip.py --exe build/launcher-release/launcher.exe --sdl3 work/release/sdl3 \
            --python work/release/toolchain-cache/trees/python --version "$VERSION" --out build/release-out \
            --kit-manifest build/kit/kit.json --toolkit work/ps3recomp-patched \
            --toolchain work/release/toolchain-cache/trees --symbols build/launcher-release/launcher.exe.debug
          cd build/release-out
          sha256sum ./*.zip
          ls -l

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ steps.ver.outputs.artifact }}
          path: |
            build/release-out/${{ steps.ver.outputs.zip }}
            build/release-out/${{ steps.ver.outputs.build_zip }}
            build/release-out/${{ steps.ver.outputs.symbols_zip }}
            build/release-out/release-body.md
          if-no-files-found: error
          # The artifact is kept 14 days: publish downloads it from this run, so re-running the publish job of a run
          # older than that fails at the download; a later release needs a new tag push (a new build).
          retention-days: 14

  # The installer (since 0.3.1): installer/rc.iss compiled with the pinned Inno Setup from the full build zip of the
  # launcher job's artifact, unpacked here (no rebuild). Launcher tags and the dry run, like the launcher job.
  # Runner: Windows, because ISCC is a Windows program; the vendor installer runs natively there, where Wine on Ubuntu
  # would add an unpinned Wine and its 32-bit side to the build. windows-2022 rather than windows-latest so an image
  # change does not move the build; Inno Setup itself is always the pinned copy, never the image's.
  installer:
    needs: launcher
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref_name, 'launcher-v')
    permissions:
      contents: read    # the checkout (installer/rc.iss, its art, names.py, toolchain.json)
      actions: read     # gh run download of the launcher job's artifact from this run
    outputs:
      artifact: ${{ steps.names.outputs.artifact }}
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      INNO_VERSION: "6.7.3"   # WizardStyle dark needs 6.6.0+; 6.7.3 is the version pinned in toolchain.json build_tools
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: python3 on PATH
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec python "$@"\n' > "$RUNNER_TEMP/bin/python3"
          chmod +x "$RUNNER_TEMP/bin/python3"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Script checks (rc.iss against the zip file list and names.py)
        run: python3 tools/release/test_rc_iss.py

      - name: Names (from the launcher job)
        id: names
        env:
          VERSION: ${{ needs.launcher.outputs.version }}
          ARTIFACT: ${{ needs.launcher.outputs.artifact }}
        run: |
          top=$(python3 -c 'import sys; sys.path.insert(0, "tools/release"); import names; print(names.build_zip_top(sys.argv[1]))' "$VERSION")
          { echo "top=$top"; echo "artifact=$ARTIFACT-setup"; } >> "$GITHUB_OUTPUT"

      # The full build zip from this run's launcher artifact, unpacked outside the checkout
      - name: Payload (the full build zip, unpacked)
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ needs.launcher.outputs.artifact }}
          BUILD_ZIP: ${{ needs.launcher.outputs.build_zip }}
          TOP: ${{ steps.names.outputs.top }}
        run: |
          set -euo pipefail
          dl="$RUNNER_TEMP/launcher-artifact"; pay="$RUNNER_TEMP/payload"
          mkdir "$dl" "$pay"
          gh run download "$GITHUB_RUN_ID" --name "$ARTIFACT" --dir "$dl"
          sha256sum "$dl/$BUILD_ZIP"
          python3 -I -m zipfile -e "$dl/$BUILD_ZIP" "$pay"
          test -f "$pay/$TOP/kit.json"
          echo "PAYLOAD=$(cygpath -w "$pay/$TOP")" >> "$GITHUB_ENV"

      - name: Inno Setup (the pinned installer, SHA-256 checked)
        shell: pwsh
        run: |
          # Official installer from the jrsoftware/issrc GitHub releases, checked against the SHA-256 pinned in
          # tools/release/toolchain.json (build_tools); a mismatch fails the job before anything runs.
          $pin = (Get-Content tools/release/toolchain.json -Raw | ConvertFrom-Json).build_tools | Where-Object name -eq innosetup
          if ($pin.version -ne $env:INNO_VERSION) { Write-Error "INNO_VERSION $env:INNO_VERSION != pinned $($pin.version)"; exit 1 }
          $exe = Join-Path $env:RUNNER_TEMP "innosetup-$($pin.version).exe"
          Invoke-WebRequest -Uri $pin.url.Replace("{version}", $pin.version) -OutFile $exe
          $got = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $pin.sha256) { Write-Error "Inno Setup SHA-256 mismatch: got $got, pinned $($pin.sha256)"; exit 1 }
          # per-user into a folder of our own, so an Inno Setup on the image is never the one used
          $dir = Join-Path $env:RUNNER_TEMP "inno"
          $p = Start-Process $exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/DIR=$dir" -Wait -PassThru
          if ($p.ExitCode) { Write-Error "Inno Setup install exit $($p.ExitCode)"; exit 1 }
          $iscc = Join-Path $dir "ISCC.exe"
          if (-not (Test-Path $iscc)) { Write-Error "ISCC not found in $dir"; exit 1 }
          # ISCC.exe carries no ProductVersion; the uninstaller next to it does
          $have = (Get-Item (Join-Path $dir "unins000.exe")).VersionInfo.ProductVersion
          if (-not "$have".StartsWith($env:INNO_VERSION)) { Write-Error "installed Inno Setup is '$have', not $env:INNO_VERSION"; exit 1 }
          "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Setup exe (ISCC)
        shell: pwsh
        env:
          VERSION: ${{ needs.launcher.outputs.version }}
          SETUP_EXE: ${{ needs.launcher.outputs.setup_exe }}
        run: |
          $out = Join-Path $PWD "build\release-out"
          New-Item -ItemType Directory -Force $out | Out-Null
          & $env:ISCC "/DAppVersion=$env:VERSION" "/DPayload=$env:PAYLOAD" "/O$out" installer\rc.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $exe = Join-Path $out $env:SETUP_EXE
          if (-not (Test-Path $exe)) { Write-Error "ISCC wrote no $env:SETUP_EXE"; exit 1 }
          Get-FileHash $exe -Algorithm SHA256 | Format-List
          Get-ChildItem $out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ steps.names.outputs.artifact }}
          path: build/release-out/${{ needs.launcher.outputs.setup_exe }}
          if-no-files-found: error
          retention-days: 14

  # Launcher tag pushes only; a dispatch never publishes (the job is skipped). One of the two jobs with write access
  # (the other is game-publish); it checks out no code. A draft full release (not a pre-release), titled
  # "Launcher vX.Y.Z", marked latest. If a release for the tag already exists the job
  # fails: nothing is edited, re-uploaded or clobbered, and no tag is touched (--verify-tag refuses to create one).
  # The assets and the notes are the launcher and installer jobs' artifacts (gh run download of this run needs actions:
  # read).
  publish:
    needs: [launcher, installer]
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'launcher-v')
    permissions:
      contents: write   # gh release create; nothing else is written
      actions: read     # gh run download of this run's artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Draft release with SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}   # gh runs with no checkout
          VERSION: ${{ needs.launcher.outputs.version }}
          ARTIFACT: ${{ needs.launcher.outputs.artifact }}
          ZIP: ${{ needs.launcher.outputs.zip }}
          BUILD_ZIP: ${{ needs.launcher.outputs.build_zip }}
          SYMBOLS_ZIP: ${{ needs.launcher.outputs.symbols_zip }}
          SETUP_ARTIFACT: ${{ needs.installer.outputs.artifact }}
          SETUP_EXE: ${{ needs.launcher.outputs.setup_exe }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF_NAME" = "launcher-v$VERSION" ] \
            || { echo "::error::tag $GITHUB_REF_NAME is not launcher-v$VERSION (names.py VERSION of the build)"; exit 1; }
          # outside any checkout: the repository has its own assets/ folder (README art)
          out="$RUNNER_TEMP/release-assets"
          mkdir "$out"
          gh run download "$GITHUB_RUN_ID" --name "$ARTIFACT" --dir "$out"
          gh run download "$GITHUB_RUN_ID" --name "$SETUP_ARTIFACT" --dir "$out"
          cd "$out"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::a release for $GITHUB_REF_NAME already exists; refusing to touch it"; exit 1
          fi
          test -s release-body.md
          sha256sum "$SETUP_EXE" "$ZIP" "$BUILD_ZIP" "$SYMBOLS_ZIP" > SHA256SUMS
          sha256sum -c SHA256SUMS
          cat SHA256SUMS
          # The launcher release is a full release marked latest at every version; game releases stay pre-releases
          gh release create "$GITHUB_REF_NAME" --draft --latest --verify-tag --title "Launcher v$VERSION" --notes-file release-body.md \
            "$SETUP_EXE" "$ZIP" "$BUILD_ZIP" "$SYMBOLS_ZIP" SHA256SUMS

  # Game tags (<id>-vX.Y.Z): the notes only, written from the CHANGELOG on a read-only job; nothing is built.
  game-notes:
    if: github.event_name == 'push' && github.ref_type == 'tag' && !startsWith(github.ref_name, 'launcher-v')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Game id and version (the version must equal names.py VERSION; the id must be a catalogue game)
        id: ver
        run: |
          want=$(python3 -c 'import sys; sys.path.insert(0, "tools/release"); import names; print(names.VERSION)')
          v="${GITHUB_REF_NAME##*-v}"
          case "$v" in
            *[!0-9.]*|.*|*.|*..*|"") echo "::error::tag $GITHUB_REF_NAME is not <game id>-vMAJOR.MINOR.PATCH"; exit 1 ;;
          esac
          if [ "$v" != "$want" ]; then
            echo "::error::tag $GITHUB_REF_NAME says $v but tools/release/names.py VERSION is $want"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # release_notes.py refuses an id that is not a catalogue game and a version section without that game's group
      - name: Release notes and title (from CHANGELOG.md and the catalogue)
        run: |
          mkdir -p build/release-out
          python3 tools/release/release_notes.py --tag "$GITHUB_REF_NAME" --out build/release-out/release-body.md \
            --title-out build/release-out/release-title.txt
          cat build/release-out/release-title.txt build/release-out/release-body.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: game-release-notes
          path: |
            build/release-out/release-body.md
            build/release-out/release-title.txt
          if-no-files-found: error
          retention-days: 14

  # The game release: a draft pre-release with notes only, never latest. Write access, no checkout.
  game-publish:
    needs: game-notes
    if: github.event_name == 'push' && github.ref_type == 'tag' && !startsWith(github.ref_name, 'launcher-v')
    permissions:
      contents: write   # gh release create; nothing else is written
      actions: read     # gh run download of this run's artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Draft pre-release, notes only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}   # gh runs with no checkout
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/release-notes"
          mkdir "$out"
          gh run download "$GITHUB_RUN_ID" --name game-release-notes --dir "$out"
          cd "$out"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::a release for $GITHUB_REF_NAME already exists; refusing to touch it"; exit 1
          fi
          test -s release-body.md
          title=$(head -n 1 release-title.txt)
          test -n "$title"
          gh release create "$GITHUB_REF_NAME" --draft --prerelease --latest=false --verify-tag --title "$title" \
            --notes-file release-body.md
