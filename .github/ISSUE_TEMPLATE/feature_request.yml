name: Feature request
description: Suggest an improvement or a PC feature
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: Check [ROADMAP.md](../blob/main/docs/ROADMAP.md) first; it may already be planned.
  - type: dropdown
    id: game
    attributes:
      label: Game
      description: "Which game this is about, if it is about one."
      options:
        - "Tools of Destruction"
        - "Quest for Booty"
        - "A Crack in Time"
        - "All 4 One"
        - "Full Frontal Assault"
        - "Into the Nexus"
        - "Collection: Ratchet & Clank"
        - "Collection: Going Commando"
        - "Collection: Up Your Arsenal"
        - "Deadlocked HD"
        - "Launcher or installer (no game running)"
        - "Not about one game"
    validations:
      required: false
  - type: textarea
    id: what
    attributes:
      label: What would you like, and why?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Display/graphics, Controls/input, Audio, Linux, Mods, Tools/build, Other]
  - type: checkboxes
    id: gameplay
    attributes:
      label: Gameplay
      options:
        - label: This would change gameplay (it would then be an opt-in setting)
  - type: input
    id: version
    attributes:
      label: Port build and game (if it matters)
      description: "The commit, and the game and title ID."
