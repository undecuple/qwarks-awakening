name: Bug report
description: Something in the port does not work as it should
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing. Please do **not** attach game files, decrypted binaries, saves or keys: only logs and screenshots.
  - type: dropdown
    id: game
    attributes:
      label: Game
      description: "Which game this is about. Every report needs one; pick the launcher or installer when no game was running."
      options:
        - "Tools of Destruction"
        - "Quest for Booty"
        - "A Crack in Time"
        - "All 4 One"
        - "Full Frontal Assault"
        - "Into the Nexus"
        - "Collection: Ratchet & Clank"
        - "Collection: Going Commando"
        - "Collection: Up Your Arsenal"
        - "Deadlocked HD"
        - "Launcher or installer (no game running)"
        - "Not about one game"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, in order.
  - type: input
    id: version
    attributes:
      label: Port build
      description: "The version and commit at the top of the game's log file, or the name of the release file you downloaded, or for a build from source the commit (`git rev-parse --short HEAD`)."
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: "OS (Windows version, or Linux distribution and Proton version), CPU, GPU and driver version."
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: Title ID, version and where
      description: "The title ID and version the launcher shows for this game (for example BCUS98127, 01.00), and where in the game it happened."
  - type: textarea
    id: logs
    attributes:
      label: Log file
      description: "Attach the newest log from the `logs\\<game>\\` folder beside the game program (and the crash report, if there is one). The program already removes your user name and home folder from it; still open it and check, and remove any host name. Never attach game files, decrypted binaries, saves or keys."
