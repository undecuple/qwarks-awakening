name: Feedback or question
description: A question, a comment or an idea that is not a bug
labels: [feedback]
body:
  - type: markdown
    attributes:
      value: |
        Questions, comments and ideas are welcome. For something that is broken use the bug report. Never attach game files.
  - type: dropdown
    id: game
    attributes:
      label: Game
      description: "Which game this is about, if it is about one."
      options:
        - "Tools of Destruction"
        - "Quest for Booty"
        - "A Crack in Time"
        - "All 4 One"
        - "Full Frontal Assault"
        - "Into the Nexus"
        - "Collection: Ratchet & Clank"
        - "Collection: Going Commando"
        - "Collection: Up Your Arsenal"
        - "Deadlocked HD"
        - "Launcher or installer (no game running)"
        - "Not about one game"
    validations:
      required: false
  - type: textarea
    id: what
    attributes:
      label: Your feedback or question
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Port build (if it matters)
      description: "The commit, and the game and title ID."
