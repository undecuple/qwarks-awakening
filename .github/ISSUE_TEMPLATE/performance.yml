name: Performance report
description: Low frame rate, stutter or audio crackle in a specific place
labels: [performance, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        The port is early work and not playable yet, so slow running is expected. Reports that help: a place that is much slower than the rest, or a change between builds. Never attach game files.
  - type: textarea
    id: where
    attributes:
      label: What you see
      description: "What is on screen, the frame rate you see, stutter or steady slowness."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Port build
      description: "The commit (`git rev-parse --short HEAD`) of the build you ran."
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: "OS (Windows version, or Linux distribution and Proton version), CPU, GPU and driver version."
    validations:
      required: true
  - type: input
    id: ram
    attributes:
      label: RAM and CPU threads
  - type: textarea
    id: logs
    attributes:
      label: Log file
      description: "Attach the newest log file the program wrote, if any. Before attaching, open it and remove your Windows or Linux user name, home folder paths and any host name (search for your user name). Never attach game files, decrypted binaries, saves or keys."
